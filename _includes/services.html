<!-- Services Section -->
<section id="services" class="section-services">
    <div class="container">
        <div class="section-header">
            <span class="section-label">What I Do</span>
            <h2>Services & Expertise</h2>
            <p class="section-intro">Comprehensive consulting across the full spectrum of modern software engineering — from foundational architecture to cutting-edge AI integration.</p>
        </div>
        <div class="services-grid">
            {% for service in site.services %}
            <div class="service-card">
                <div class="service-icon">
                    <i class="fa {{service.font-awesome}}"></i>
                </div>
                <h3>{{service.title}}</h3>
                <p>{{service.description}}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
