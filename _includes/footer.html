<footer class="site-footer">
    <div class="container">
        <div class="footer-content">
            <div class="footer-brand">
                <span class="footer-logo">Carlstedt Consulting</span>
                <p class="footer-tagline">Engineering Excellence. Architectural Rigour. AI Innovation.</p>
            </div>
            <div class="footer-social">
                {% for network in site.social-networks %}
                <a href="{{ network.url }}" aria-label="{{ network.title }}"><i class="fa fa-{{ network.title }}"></i></a>
                {% endfor %}
            </div>
        </div>
        <div class="footer-bottom">
            <span class="copyright">&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. All rights reserved.</span>
            <span class="footer-location">Malmö, Sweden</span>
        </div>
    </div>
</footer>
